# ============================================================
# BookHealth 二级域名 Nginx 配置（部署到服务器系统 Nginx）
# 
# 使用方法：
#   1. 复制此文件到服务器 /etc/nginx/sites-available/health.conf
#   2. 修改下方 your-domain.com 为你的真实域名
#   3. ln -s /etc/nginx/sites-available/health.conf /etc/nginx/sites-enabled/
#   4. nginx -t && systemctl reload nginx
#   5. 如需 HTTPS: certbot --nginx -d health.your-domain.com
# ============================================================

# ---- HTTP 版本（无 SSL，先用这个测试） ----
server {
    listen 80;
    server_name health.your-domain.com;

    # 前端：代理到 Docker 中的 Nginx（端口 8090）
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 后端 API：代理到 Docker 中的 Express（端口 3002）
    location /api/ {
        proxy_pass http://127.0.0.1:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # 上传文件代理
    location /uploads/ {
        proxy_pass http://127.0.0.1:3002;
    }

    client_max_body_size 10m;
}

