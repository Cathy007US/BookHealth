version: '3.8'

services:
  # ============================
  # PostgreSQL 数据库
  # ============================
  db:
    image: postgres:16-alpine
    restart: always
    env_file:
      - bookhealth-api.env
    environment:
      POSTGRES_DB: bookhealth
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ============================
  # 后端 API
  # ============================
  backend:
    image: health-backend:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - bookhealth-api.env
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: bookhealth
      DB_USER: postgres
      DB_PASSWORD: ${DB_PASSWORD:-postgres123}
      JWT_SECRET: ${JWT_SECRET:-bookhealth_jwt_secret_2026}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET:-bookhealth_admin_jwt_secret_2026}
      JWT_EXPIRES_IN: 7d
      ADMIN_JWT_EXPIRES_IN: 24h
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 10485760
    ports:
      - "3002:3000"
    volumes:
      - backend_uploads:/app/uploads

  # ============================
  # 前端 Nginx
  # ============================
  frontend:
    image: health-frontend:latest
    restart: always
    depends_on:
      - backend
    ports:
      - "8090:80"

volumes:
  pgdata:
  backend_uploads:
