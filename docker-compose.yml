# ============================================================
# BookHealth 生产部署编排（服务器使用）
#
# 设计要点（和旧版最大的区别）：
#   1. 前端 = 官方 nginx 镜像 + 挂载 ./runtime/frontend
#      → 改前端只要上传几个静态文件，几秒钟生效，不用构建镜像
#   2. 后端 = 基础镜像（含 node_modules）+ 挂载 ./runtime/backend/dist
#      → 改后端只上传编译产物（几百 KB），重启容器即可
#   3. 所有密码/密钥/库名只来自 bookhealth-api.env，改文件 + 重启容器生效
#      （这里不要写 DB_NAME / DB_USER / DB_PASSWORD 的硬编码值，
#        否则 environment 会覆盖 env_file，改 env 文件就不生效了 —— 之前 502 就是这个原因）
#
# 常用命令：
#   docker compose up -d --build                    # 首次部署（构建后端基础镜像）
#   docker compose up -d --force-recreate backend   # 改 env / 换 dist 后
#   docker compose ps / docker compose logs -f backend
# ============================================================

services:
  # ---------------------- PostgreSQL ----------------------
  db:
    image: postgres:16-alpine
    restart: always
    # POSTGRES_DB / POSTGRES_USER / POSTGRES_PASSWORD 全部来自 env_file，不在这里覆盖
    env_file:
      - bookhealth-api.env
    ports:
      - "5434:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      # $$ 是 compose 转义，实际由容器内 shell 展开 POSTGRES_USER/POSTGRES_DB
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 10

  # ------------------------ 后端 API ------------------------
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: health-backend:latest
    restart: always
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - bookhealth-api.env
    environment:
      NODE_ENV: production
      PORT: 3000
      # 只有网络位置写死，库名/用户/密码统一由 env_file 里的 DB_* 提供
      DB_HOST: db
      DB_PORT: 5432
      UPLOAD_DIR: uploads
      MAX_FILE_SIZE: 10485760
    ports:
      - "3002:3000"
    volumes:
      # 挂载编译产物：换代码不用重建镜像
      - ./runtime/backend/dist:/app/dist:ro
      - backend_uploads:/app/uploads
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ----------------------- 前端 Nginx -----------------------
  frontend:
    image: nginx:alpine
    restart: always
    depends_on:
      - backend
    ports:
      - "8090:80"
    volumes:
      # 挂载构建好的静态文件：替换文件即生效，无需重启
      - ./runtime/frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  pgdata:
  backend_uploads:
