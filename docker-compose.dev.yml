# ============================================================
# BookHealth 本地开发编排
#
# 只负责数据库。前后端用 scripts/dev.sh 以原生方式启动（热更新最快）：
#   ./scripts/dev.sh
#
# 如果你本机没有 PostgreSQL，用这个文件起一个容器库（映射到 5434）：
#   docker compose -f docker-compose.dev.yml up -d
#   DB_PORT=5434 ./scripts/dev.sh
# ============================================================

services:
  db:
    image: postgres:16-alpine
    container_name: bookhealth-db-dev
    restart: unless-stopped
    env_file:
      - bookhealth-api.env
    ports:
      - "5434:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-postgres}\" -d \"$${POSTGRES_DB:-postgres}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata_dev:
